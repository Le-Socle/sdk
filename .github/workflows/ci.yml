# À chaque pull request et à chaque arrivée sur main : les mêmes commandes que sur un poste,
# depuis un dépôt propre. Objectif : moins de 10 minutes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, contrôles, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Génère les quatre sorties de jetons, puis types (tsc).
      - run: npm run typecheck
      - run: npm run lint
      # Format des jetons, correspondance des noms, aucun nom de marque, aucune valeur en dur
      # (une PR qui ajoute une couleur écrite en dur échoue ici), contrastes WCAG 2.2 AA, tests.
      - run: npm run check:tokens
      - run: npm run check:mapping
      - run: npm run check:brands
      - run: npm run check:hardcoded
      - run: npm run check:contrast
      - run: npm test
      # dist/ : modules ESM par point d'entrée, types, feuilles CSS.
      - run: npm run build:lib
      - run: npm run build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7

  stories:
    name: Rendu des stories (navigateur headless)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
      - name: Installer le navigateur de rendu des tests (hors paquet)
        run: npx playwright-core install --with-deps chromium-headless-shell
      # Une PR qui casse une story échoue ici : erreur de page, console.error, appel distant,
      # débordement horizontal, story vide, marque ou thème non appliqué.
      - run: node scripts/verify-stories.mjs --out captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-stories
          path: captures
          retention-days: 7
